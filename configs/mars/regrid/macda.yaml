# mars-macda-hf-o24-0024-0035-2h-v3
# Regridded variant of ../macda.yaml.
#
# The source is the *already-built* anemoi dataset produced by
# ../macda.yaml (mars-macda-hf-5p0-0024-0035-2h-v3), which is opened
# via the built-in ``anemoi_dataset`` source and then passed through a
# ``regrid`` step onto an octahedral reduced Gaussian O24 grid using
# the pre-computed regridding matrix at
# static/matrices/mars/5deg_to_o24.npz.
#
# See ../openmars_regridded.yaml for the canonical example of the
# pipe: [<source>, regrid] pattern (left untouched).

name: mars-macda-hf-o24-0024-0035-2h-v3

description: >-
  ARCO-MACDA v2.0 reanalysis (MY24-35), regridded to O24 from the
  native 5.0 deg lat/lon dataset produced by ../macda.yaml.

attribution: >-
  Bhattacharya (2026), doi:10.57967/hf/8771.
  Montabone et al. (2014), doi:10.1002/gdj3.13.
  Valeanu et al. (2026), doi:10.5285/CD037A9EA387438FABF4D674DBE53088.

licence: CC-BY-4.0

dates:
  start: '2000-01-01T00:00:00'
  end:   '2022-01-04T22:00:00'
  frequency: 2h
  # MACDA has no gaps after sort+dedup (THEMIS fills MY27-28).

input:
  pipe:
    - anemoi_dataset:
        dataset: mars-macda-hf-5p0-0024-0035-2h-v3
    - regrid:
        matrix: static/matrices/mars/5deg_to_o24.npz
