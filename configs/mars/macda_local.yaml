# mars-macda-local-5p0-0024-0035-2h-v1
# ARCO-MACDA: Mars Analysis Correction Data Assimilation v2.0
# Source: Montabone et al. (2014), Valeanu et al. (2026)
# DOI: 10.57967/hf/8771
# Grid: 36 lat x 72 lon (5.0 deg), 35 sigma levels
# Sampling: 12 steps/sol (every 2 Mars hours)
# Coverage: Mars Years 24-35 (continuous, no gaps)
#
# Local backend: build from a predownloaded copy of the zarr store on
# disk (no network access). Set `local_path` to the .zarr store or a
# directory containing it, or omit it and set $ARCO_MARS_LOCAL_ROOT.

name: mars-macda-local-5p0-0024-0035-2h-v1

description: >-
  ARCO-MACDA v2.0 reanalysis (MY24-35) built from a local copy.
  UK LMD MGCM with Analysis Correction scheme assimilating
  MGS/TES, ODY/THEMIS, and MRO/MCS retrievals.

attribution: >-
  Bhattacharya (2026), doi:10.57967/hf/8771.
  Montabone et al. (2014), doi:10.1002/gdj3.13.
  Valeanu et al. (2026), doi:10.5285/CD037A9EA387438FABF4D674DBE53088.

licence: CC-BY-4.0

dates:
  start: '2000-01-01T00:00:00'
  end:   '2022-01-04T22:00:00'
  frequency: 2h
  # MACDA has no gaps after sort+dedup (THEMIS fills MY27-28).

input:
  join:
    - arcomars:
        dataset: ARCO-MACDA
        backend: local
        # Path to the predownloaded .zarr store, or the directory
        # containing it (macda_combined.zarr is appended automatically).
        # If omitted, $ARCO_MARS_LOCAL_ROOT is used as the base dir.
        local_path: /data/mars/macda_combined.zarr

    - mars_forcings:
        dataset: ARCO-MACDA
        param:
          - cos_latitude
          - sin_latitude
          - cos_longitude
          - sin_longitude
          - cos_sol_of_year
          - sin_sol_of_year
          - cos_local_time
          - sin_local_time
          - cos_solar_longitude
          - sin_solar_longitude
          - insolation
