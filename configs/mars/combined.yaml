# mars-openmars-macda-hf-5p0-0024-0035-2h-v1
# Combined dataset: core variables from OpenMARS, extras from MACDA
# Grid: 36 lat x 72 lon (5.0 deg), 35 sigma levels
# Sampling: 12 steps/sol (every 2 Mars hours)
# Coverage: Mars Years 24-35 (limited by OpenMARS end date)

name: mars-openmars-macda-hf-5p0-0024-0035-2h-v1

description: >-
  Combined ARCO-Mars dataset (MY24-35).
  Core variables (t, u, v, sp, skt, co2ice, tcdo) from OpenMARS,
  additional variables (dust, z, w, ssrd, strd) from MACDA.

attribution: >-
  Bhattacharya (2026), doi:10.57967/hf/8741, doi:10.57967/hf/8771.
  Holmes, Lewis & Patel (2020), doi:10.1016/j.pss.2020.104962.
  Montabone et al. (2014), doi:10.1002/gdj3.13.

licence: CC-BY-4.0

dates:
  start: '2000-01-01T00:00:00'
  end:   '2021-06-08T22:00:00'
  frequency: 2h
  # MY27-28 gap: ~510 sols where neither TES nor MCS had data.
  # The source inserts 6120 NaN-filled steps; exclude from training.
  missing:
    - start: '2005-06-03T00:00:00'
      end:   '2006-10-25T22:00:00'

input:
  join:
    # --- Core variables from OpenMars (t, u, v, sp, skt, co2ice, tcdo) ---
    - openmars:
        dataset: ananyo01/ARCO-OpenMars

    # --- MACDA-only variables (dust, z, w, ssrd, strd) ---
    - openmars:
        dataset: ananyo01/ARCO-MACDA
        param: [dust, z, w, ssrd, strd]

    # --- Mars-specific forcings ---
    - mars_forcings:
        dataset: ananyo01/ARCO-OpenMars
        param:
          - cos_latitude
          - sin_latitude
          - cos_longitude
          - sin_longitude
          - cos_julian_day
          - sin_julian_day
          - cos_local_time
          - sin_local_time
          - solar_longitude
          - insolation
