# mars-openmars-hf-5p0-0024-0035-2h-v2
# ARCO-OpenMARS: Open access to Mars Assimilated Remote Soundings
# Source: Holmes, Lewis & Patel (2020)
# DOI: 10.57967/hf/8741
# Grid: 36 lat x 72 lon (5.0 deg), 35 sigma levels
# Sampling: 12 steps/sol (every 2 Mars hours)
# Coverage: Mars Years 24-35, MY27-28 gap (data void, not filled)

name: mars-openmars-hf-5p0-0024-0035-2h-v3

description: >-
  ARCO-OpenMARS reanalysis (MY24-35).
  UK LMD MGCM with Analysis Correction scheme assimilating
  MGS/TES, MRO/MCS, and MEx/SPICAM retrievals.
  Eras MY24-27 and MY28-35 are merged into continuous variables.

attribution: >-
  Bhattacharya (2026), doi:10.57967/hf/8741.
  Holmes, Lewis & Patel (2020), doi:10.1016/j.pss.2020.104962.

licence: CC-BY-4.0

dates:
  start: '2000-01-01T00:00:00'
  end:   '2021-06-08T22:00:00'
  frequency: 2h
  # The MY27-28 gap (TES/MCS data void) is a genuine data gap.
  # The source inserts NaN-filled steps to preserve the datetime-to-sol
  # mapping.  These dates are listed below so the pipeline skips them.
  missing:
    - start: '2005-06-03T00:00:00'
      end:   '2006-10-25T22:00:00'

input:
  join:
    - arcomars:
        dataset: ananyo01/ARCO-OpenMars

    - mars_forcings:
        dataset: ananyo01/ARCO-OpenMars
        param:
          - cos_latitude
          - sin_latitude
          - cos_longitude
          - sin_longitude
          - cos_sol_of_year
          - sin_sol_of_year
          - cos_local_time
          - sin_local_time
          - cos_solar_longitude
          - sin_solar_longitude
          - insolation
