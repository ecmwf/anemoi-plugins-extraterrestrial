# mars-emars-hf-5p0x6p0-0024-0033-1h-v2
# ARCO-EMARS: Ensemble Mars Atmosphere Reanalysis System v1.0
# Source: Greybush et al. (2019)
# DOI: 10.57967/hf/8859
# Grid: 36 lat x 60 lon (5.0 x 6.0 deg), 28 hybrid sigma-pressure levels
# Sampling: 24 steps/sol (every Mars hour)
# Coverage: Mars Years 24-33, data gap MY27-28 (no TES/MCS)

name: mars-emars-hf-5p0x6p0-0024-0033-1h-v2

description: >-
  ARCO-EMARS v1.0 reanalysis ensemble mean (MY24-33).
  GFDL Mars GCM with Local Ensemble Transform Kalman Filter
  assimilating MGS/TES and MRO/MCS temperature retrievals.

attribution: >-
  Bhattacharya (2026), doi:10.57967/hf/8859.
  Greybush et al. (2019), doi:10.1002/gdj3.77.
  Greybush et al. (2012), doi:10.1029/2012JE004097.

licence: CC-BY-4.0

dates:
  start: '2000-01-01T00:00:00'
  end:   '2014-08-04T23:00:00'
  frequency: 1h

input:
  join:
    - openmars:
        dataset: ananyo01/ARCO-EMARS

    - mars_forcings:
        dataset: ananyo01/ARCO-EMARS
        param:
          - cos_latitude
          - sin_latitude
          - cos_longitude
          - sin_longitude
          - cos_julian_day
          - sin_julian_day
          - cos_local_time
          - sin_local_time
          - solar_longitude
          - insolation
