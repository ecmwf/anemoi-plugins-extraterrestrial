#
# CodeQL SAST scanning for Python sources.  Third-party actions are
# pinned to immutable commit SHAs.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"  # weekly, Monday 04:17 UTC

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [python]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v5.0.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066  # v3.28.13
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        # Non-blocking: the analyze step attempts to upload results to
        # the Security tab, which requires Code Scanning to be enabled
        # on the repository (Settings -> Code security -> Code scanning).
        # Once enabled, remove `continue-on-error: true` to make CodeQL
        # a required check.
        continue-on-error: true
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea  # v3.28.13
        with:
          category: "/language:${{ matrix.language }}"
