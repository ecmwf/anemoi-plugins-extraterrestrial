#
# CodeQL SAST scanning for Python sources.  Third-party actions are
# pinned to immutable commit SHAs.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"  # weekly, Monday 04:17 UTC

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [python]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v5.0.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3  # v3.28.13
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        # Non-blocking: the analyze step attempts to upload results to
        # the Security tab, which requires Code Scanning to be enabled
        # on the repository (Settings -> Code security -> Code scanning).
        # Once enabled, remove `continue-on-error: true` to make CodeQL
        # a required check.
        continue-on-error: true
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81  # v3.28.13
        with:
          category: "/language:${{ matrix.language }}"
