# This workflow will upload a Python Package using Twine when a release is created
# For more information see: https://help.github.com/en/actions/language-and-framework-guides/using-python-with-github-actions#publishing-to-package-registries

name: Upload Python Package to PyPI

on:
  release:
    types: [created]

# Least-privilege at the workflow scope; the deploy job inherits
# org-level secrets (including PYPI_API_TOKEN) as required by the
# reusable cd-pypi.yml, which uses twine + API-token auth.
permissions:
  contents: read

jobs:
  deploy:
    uses: ecmwf/reusable-workflows/.github/workflows/cd-pypi.yml@631d38ab6601b12c7b5a51d4dd55dac5aa6702eb  # v2
    # ecmwf/reusable-workflows v2 cd-pypi.yml authenticates to PyPI
    # with `TWINE_USERNAME=__token__` + `TWINE_PASSWORD=secrets.PYPI_API_TOKEN`,
    # so we must pass the org-inherited secret through.  Removing this
    # line makes PyPI return `403 Forbidden` (empty password).
    secrets: inherit
