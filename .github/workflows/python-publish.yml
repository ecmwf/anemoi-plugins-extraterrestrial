#
# This workflow will upload a Python Package using Twine when a release is created
# For more information see: https://help.github.com/en/actions/language-and-framework-guides/using-python-with-github-actions#publishing-to-package-registries

name: Upload Python Package to PyPI

on:
  release:
    types: [created]

# Least-privilege permissions at the workflow level; the reusable
# workflow declares its own job-level permissions (id-token: write for
# PyPI OIDC trusted publishing).
permissions:
  contents: read

jobs:
  deploy:
    uses: ecmwf/reusable-workflows/.github/workflows/cd-pypi.yml@592e3dd68954d6c84039f3d9343adef8da264686  # v2
    # Prefer PyPI OIDC (Trusted Publishing) over inherited API tokens.
    # If the reusable workflow requires no secrets (OIDC-only), we can
    # drop `secrets: inherit` entirely.  Kept commented for reference:
    # secrets: inherit
    permissions:
      contents: read
      id-token: write   # required for PyPI Trusted Publishing (OIDC)
