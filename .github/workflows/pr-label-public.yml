# Manage labels of pull requests that originate from forks.
name: "[PR] Label Forks"

on:
  pull_request_target:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    uses: ecmwf/reusable-workflows/.github/workflows/label-pr.yml@6441ce75e023ec2cbcdc546bd45832d561f5f432  # v2
