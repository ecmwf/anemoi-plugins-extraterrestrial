# Manage labels of pull requests that originate from forks.
name: "[PR] Label Forks"

on:
  pull_request_target:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    uses: ecmwf/reusable-workflows/.github/workflows/label-pr.yml@631d38ab6601b12c7b5a51d4dd55dac5aa6702eb  # v2
