# Manage labels of pull requests that originate from forks.
name: "[PR] Label Forks"

on:
  pull_request_target:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    uses: ecmwf/reusable-workflows/.github/workflows/label-pr.yml@b485d663ccd989a468530802ef6792516e051cb9  # v2
