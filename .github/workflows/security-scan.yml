#
# Supplementary security scanning:
#   * pip-audit  — resolves pyproject.toml + extras and checks each
#                  installed distribution against the PyPI advisory DB.
#   * Bandit     — lightweight Python SAST (complements CodeQL).
# Both jobs upload SARIF for the GitHub Security tab.
name: Security scans

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"  # weekly, Monday 05:23 UTC

permissions:
  contents: read

jobs:
  pip-audit:
    name: pip-audit (dependency CVEs)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Run pip-audit against pyproject
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266  # v1.1.0
        with:
          # Audit the project + all optional extras so transitive
          # deps of `mars`, `mars-earthmover` and `distances` are
          # covered too.
          inputs: "."
          extra-args: "--strict --disable-pip"

  bandit:
    name: Bandit SAST
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: pip install "bandit[sarif]>=1.7.9"

      - name: Run Bandit
        run: |
          bandit -r src -f sarif -o bandit.sarif || true

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@4e94bd11f71e507f7f87df81788dff88d1dacbfb  # v3.28.13
        with:
          sarif_file: bandit.sarif
          category: bandit
