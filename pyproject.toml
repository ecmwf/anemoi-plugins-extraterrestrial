[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=75", "setuptools-scm>=8" ]

[project]
name = "anemoi-plugins-extraterrestrial"
description = "Anemoi plugin for extraterrestrial datasets"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = [ "LICENSE" ]
authors = [ { name = "Anemoi contributors" } ]
keywords = [ "anemoi", "mars", "reanalysis", "arco", "extraterrestrial", "weather" ]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
]
urls.Homepage = "https://github.com/ecmwf/anemoi-plugins-extraterrestrial"
urls.Repository = "https://github.com/ecmwf/anemoi-plugins-extraterrestrial"
urls.Issues = "https://github.com/ecmwf/anemoi-plugins-extraterrestrial/issues"
urls.Changelog = "https://github.com/ecmwf/anemoi-plugins-extraterrestrial/blob/main/CHANGELOG.md"
dynamic = [ "version" ]
dependencies = [ "anemoi-datasets" ]
optional-dependencies.distances = [
  "astropy>=8",
]
optional-dependencies.mars = [
  "earthkit-data",
  "fsspec>=2026.6",
  "huggingface-hub>=1.21",
  "xarray>=2026.4",
  "zarr>=3",
]
# Extra backend: Earthmover / Arraylake catalogue for the ARCO Mars
# datasets (arco-planetary/ARCO-*).  Not required for the default
# HuggingFace backend.
optional-dependencies.mars-earthmover = [
  "arraylake",
]
scripts.mars-revert-time = "anemoi.plugins.extraterrestrial.mars.revert_time:main"
entry-points."anemoi.datasets.create.sources".arcomars = "anemoi.plugins.extraterrestrial.mars.source:ArcoMarsSource"
entry-points."anemoi.datasets.create.sources".distance_forcings = "anemoi.plugins.extraterrestrial.distance_forcing:DistanceForcingsSource"
entry-points."anemoi.datasets.create.sources".mars_forcings = "anemoi.plugins.extraterrestrial.mars.forcings:MarsForcingsSource"

[dependency-groups]
dev = [
  "pytest>=9.1.1",
]

[tool.setuptools]
packages.find.where = [ "src" ]

[tool.setuptools_scm]
version_file = "src/anemoi/plugins/extraterrestrial/_version.py"
